name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Expose the baseline branch for the legacy-source invariant
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi
      - run: python -m compileall -q eventbot scripts tests audit
      - run: ruff check .
      - run: mypy .
      - run: python -m pytest -ra
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Start isolated test infrastructure
        run: docker compose up -d --wait --wait-timeout 180
      - name: Run real Kafka and Redis checks
        run: python -m pytest -m integration -ra --junitxml=integration-results.xml
      - name: Require tests to run without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('integration-results.xml')
          cases = list(tree.iter('testcase'))
          assert len(cases) == 7
          assert all(case.find('skipped') is None for case in cases)
          PY
      - name: Stop test infrastructure
        if: always()
        run: docker compose down --volumes
